# Runtime choices. Keep credentials in the ignored root .env.
models:
  default: qwen-omlx
  enabled: [qwen-omlx]
  # Optional cap; defaults to 262144 tokens.
  # max_context_tokens: 262144

network:
  # Shared local model API and remote node discovery port.
  gateway_port: 8888

applications:
  # Browser gateway only. Set false for localhost access only.
  lan_browser: true
  images: true
  remote_browser: false

integrations:
  calendar:
    # Requires calendar read permission for the host application in macOS.
    enabled: false
    # Empty selects all synced calendars. Keep personal IDs out of public commits.
    calendar_ids: []
